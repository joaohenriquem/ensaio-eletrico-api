services:
  - type: web
    name: ensaio-eletrico-api
    env: node
    root: .
    branch: main
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_URL
        value: "https://<seu-servico>.onrender.com"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER
        value: "ensaioeletrico.servicos@gmail.com"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
